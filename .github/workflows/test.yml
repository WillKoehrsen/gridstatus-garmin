name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Bundles the Connect IQ SDK, device files and a headless simulator.
    container: ghcr.io/matco/connectiq-tester:v2.10.0
    env:
      CONNECTIQ_DEVELOPER_KEY: /tmp/developer_key.der
      DISPLAY: ":1"
    steps:
      - uses: actions/checkout@v4

      - name: Create a temporary developer key
        run: |
          openssl genrsa -out /tmp/developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/developer_key.pem -out /tmp/developer_key.der -nocrypt

      # The container's device files live under /root, but GitHub sets HOME to /github/home.
      - name: Build
        run: HOME=/root scripts/build.sh

      - name: Run unit tests
        run: |
          export HOME=/root
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          simulator > /dev/null 2>&1 &
          sleep 5
          scripts/test.sh

      # Catches a change that compiles for one watch but not another. The container lags new watches, so those are skipped.
      - name: Build the store package for every watch the container has
        run: |
          export HOME=/root
          for device in $(grep -o '<iq:product id="[^"]*"/>' manifest.xml | cut -d'"' -f2); do
            if [ ! -d "/root/.Garmin/ConnectIQ/Devices/$device" ]; then
              echo "Skipping $device, which the container doesn't have"
              sed -i "/<iq:product id=\"$device\"\/>/d" manifest.xml
            fi
          done
          scripts/package.sh
